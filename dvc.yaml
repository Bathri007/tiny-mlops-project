# DVC pipeline: `dvc repro` re-runs only the stages whose deps/params changed.
#   dvc dag            -> visualise   prepare_train -> evaluate_gate -> codegen_cpp
#   dvc metrics show   -> FP32 / INT8 accuracy, sizes, gate results
#   dvc params diff    -> what hyperparameters changed vs. the last commit
stages:
  prepare_train:
    cmd: python ml_pipeline/train_and_quantize.py
    deps:
      - ml_pipeline/train_and_quantize.py
    params:
      - ml_pipeline/config.yaml:
          - project.seed
          - data
          - model
          - training
          - quantization
    outs:
      - artifacts/baseline_fp32.tflite
      - artifacts/model_qat_int8.tflite
    metrics:
      - artifacts/metrics.json:
          cache: false

  evaluate_gate:
    cmd: python ml_pipeline/evaluate_and_gate.py
    deps:
      - ml_pipeline/evaluate_and_gate.py
      - artifacts/baseline_fp32.tflite
      - artifacts/model_qat_int8.tflite
    params:
      - ml_pipeline/config.yaml:
          - gates
    outs:
      - artifacts/golden_vectors.json
    metrics:
      - artifacts/gate_report.json:
          cache: false

  codegen_cpp:
    cmd: python ml_pipeline/export_to_cpp.py
    deps:
      - ml_pipeline/export_to_cpp.py
      - artifacts/model_qat_int8.tflite
      - artifacts/golden_vectors.json
      - artifacts/gate_report.json
    outs:
      # committed to git (cache: false) so the firmware builds without running the ML stages
      - firmware_esp32/src/model_data.h:
          cache: false
      - firmware_esp32/src/test_vectors.h:
          cache: false
