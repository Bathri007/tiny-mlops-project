# =============================================================================
# TinyMLOps: Knowledge-Distilled MNIST Student -> ESP32-WROOM-32
# Single source of truth. Every script in ml_pipeline/ and tests/ reads this file.
# Change a value here, push, and GitHub Actions re-trains the teacher (if its
# config changed), re-distills the student, re-gates, regenerates C++, rebuilds
# and re-simulates the firmware automatically.
# =============================================================================

project:
  name: tinymlops-kd-mnist-esp32
  course: "CDS 303 - TinyML"
  seed: 42

paths:
  artifacts_dir: artifacts
  fp32_tflite: artifacts/kd_student_fp32.tflite      # FP32 reference of the deployed student
  int8_tflite: artifacts/kd_student_int8.tflite      # the model that ships to the ESP32
  teacher_cache_dir: artifacts/teacher_cache         # trained teachers, keyed by config hash
  metrics_json: artifacts/metrics.json
  gate_report_json: artifacts/gate_report.json
  golden_vectors_json: artifacts/golden_vectors.json
  firmware_src_dir: firmware_esp32/src
  model_header: firmware_esp32/src/model_data.h
  vectors_header: firmware_esp32/src/test_vectors.h
  mlflow_tracking_uri: mlruns                        # local file store (./mlruns)
  colab_import_dir: models/colab                     # exact Colab models for `make import-colab`

data:
  num_classes: 10
  input_shape: [28, 28, 1]
  validation_split: 0.1

# Architectures are built layer by layer from these lists (conv = 3x3 ReLU,
# pool = 2x2 max-pool, dense = ReLU, logits = final Dense(num_classes) without softmax).
models:
  teacher:                         # large CNN, 503,690 params - never deployed
    - {type: conv, filters: 32}
    - {type: conv, filters: 64}
    - {type: pool}
    - {type: conv, filters: 128}
    - {type: pool}
    - {type: flatten}
    - {type: dense, units: 128}
    - {type: logits}
  student:                         # tiny CNN, 14,410 params - deployed to the ESP32
    - {type: conv, filters: 8}
    - {type: pool}
    - {type: conv, filters: 16}
    - {type: pool}
    - {type: flatten}
    - {type: dense, units: 32}
    - {type: logits}

training:
  teacher:
    epochs: 5
    batch_size: 128
    learning_rate: 0.001
  baseline_student:                # same student architecture, trained on labels only (KD control)
    epochs: 5
    batch_size: 128
    learning_rate: 0.001
  kd_student:
    epochs: 5
    batch_size: 128
    learning_rate: 0.001

distillation:
  alpha: 0.1                       # weight of the hard-label loss; (1 - alpha) goes to the KL distillation loss
  temperature: 5                   # softening temperature T (KL loss scaled by T^2)

quantization:
  method: ptq_full_int8            # post-training full-integer quantization (as in the Assignment 4 notebook)
  representative_samples: 200      # first N training images calibrate activation ranges
  inference_input_type: int8
  inference_output_type: int8

gates:
  max_model_bytes: 35000           # Flash ceiling for the INT8 flatbuffer (~34 KB)
  min_int8_accuracy: 0.960         # INT8 accuracy floor over all 10,000 test images
  max_accuracy_drop: 0.015         # FP32 KD student -> INT8 KD student drop budget (1.5 pp)
  allowed_ops:                     # TFLite Micro kernels registered in main.cpp
    - CONV_2D
    - MAX_POOL_2D
    - RESHAPE
    - FULLY_CONNECTED
    - QUANTIZE
    - DEQUANTIZE

golden_vectors:
  count: 10                        # one per digit 0..9
  selection: first_correct_per_class   # first test image of each digit the INT8 model gets right

hardware:
  target: ESP32-WROOM-32
  cpu: Xtensa LX6 dual-core @ 240 MHz
  flash_bytes: 4194304             # 4 MB
  sram_bytes: 532480               # 520 KB
  tensor_arena_bytes: 32768        # must match kTensorArenaSize in main.cpp
  max_avg_latency_us: 100000       # real-hardware latency budget per inference (100 ms)
  # Wokwi is not cycle-accurate: its simulated esp_timer reported ~1 s per inference even
  # for the earlier 20k-param CNN, so simulated latency is reported but only sanity-checked
  # against a loose ceiling (catches hangs/regressions). Real latency: `make hil` on a board.
  sim_max_avg_latency_us: 5000000
