# =============================================================================
# TinyMLOps MNIST -> ESP32-WROOM-32 : single source of truth
# Every script in ml_pipeline/ and tests/ reads this file. Change a value here,
# push, and the GitHub Actions pipeline retrains, re-gates, regenerates C++,
# recompiles and re-simulates the firmware automatically.
# =============================================================================

project:
  name: tinymlops-mnist-esp32
  course: "CDS 303 - TinyML"
  seed: 42

paths:
  artifacts_dir: artifacts
  baseline_tflite: artifacts/baseline_fp32.tflite
  int8_tflite: artifacts/model_qat_int8.tflite
  metrics_json: artifacts/metrics.json
  gate_report_json: artifacts/gate_report.json
  golden_vectors_json: artifacts/golden_vectors.json
  firmware_src_dir: firmware_esp32/src
  model_header: firmware_esp32/src/model_data.h
  vectors_header: firmware_esp32/src/test_vectors.h
  mlflow_tracking_uri: mlruns          # local file store (./mlruns)

data:
  num_classes: 10
  input_shape: [28, 28, 1]
  validation_split: 0.1

model:
  # InputLayer(28,28,1) -> Conv2D(12,3x3,relu) -> MaxPool(2x2) -> Flatten -> Dense(10 logits)
  conv_filters: 12
  conv_kernel: [3, 3]
  pool_size: [2, 2]

training:
  baseline:
    batch_size: 32
    epochs: 2
    learning_rate: 0.001
  qat:
    batch_size: 32
    epochs: 2
    learning_rate: 0.0005

quantization:
  representative_samples: 100          # calibration images for the INT8 converter
  inference_input_type: int8
  inference_output_type: int8

gates:
  max_model_bytes: 35000               # Flash ceiling for the INT8 flatbuffer (~34 KB)
  min_int8_accuracy: 0.960             # INT8 accuracy floor over all 10,000 test images
  max_accuracy_drop: 0.015             # FP32 -> INT8 drop budget (1.5 percentage points)
  allowed_ops:                         # TFLite Micro kernels registered in main.cpp
    - CONV_2D
    - MAX_POOL_2D
    - RESHAPE
    - FULLY_CONNECTED
    - QUANTIZE
    - DEQUANTIZE

golden_vectors:
  count: 10                            # one per digit 0..9
  selection: first_correct_per_class   # first test-set image of each digit the INT8 model gets right

hardware:
  target: ESP32-WROOM-32
  cpu: Xtensa LX6 dual-core @ 240 MHz
  flash_bytes: 4194304                 # 4 MB
  sram_bytes: 532480                   # 520 KB
  tensor_arena_bytes: 32768            # must match kTensorArenaSize in main.cpp
  max_avg_latency_us: 100000           # HIL latency budget per inference (100 ms)
