; =============================================================================
;  TinyMLOps MNIST firmware for ESP32-WROOM-32 (4 MB flash, 520 KB SRAM)
;  Build   : pio run              (from firmware_esp32/)  or  make build-fw
;  Flash   : pio run -t upload    (real board on USB)
;  Monitor : pio device monitor
;  Simulate: wokwi-cli .          (uses wokwi.toml -> .pio/build/esp32dev/firmware.bin)
; =============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0          ; arduino-esp32 2.0.17 / ESP-IDF 4.4
board = esp32dev                      ; generic ESP32-WROOM-32 DevKit
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_build.partitions = default.csv  ; app0/app1 1.25 MB each + 1.375 MB LittleFS for model slots A/B
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; TensorFlow Lite Micro packaged for Arduino-ESP32
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@1.0.0

build_flags =
    -O2
    -DTINYMLOPS_FW_VERSION=\"2.0.0\"
    -DTINYMLOPS_TENSOR_ARENA_KB=32
    -DTINYMLOPS_LED_PIN=2
    -DCORE_DEBUG_LEVEL=0
build_unflags = -Os
; Full flash image for Wokwi so it uses our partition table (LittleFS model slots)
extra_scripts = post:tools/merge_firmware.py
; `pio run` prints the Flash (% of 1.25 MB app partition) / RAM (% of 320 KB DRAM) summary;
; `pio run -t size` shows the per-section breakdown (see Makefile `fw-size`).
