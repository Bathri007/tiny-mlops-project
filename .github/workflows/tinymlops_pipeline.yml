# =============================================================================
#  TinyMLOps CI/CD : Teacher -> Knowledge-distilled student -> INT8 PTQ ->
#                    Quality Gates -> C++ Codegen -> PlatformIO build ->
#                    Wokwi ESP32 HIL simulation -> Report
# =============================================================================
name: TinyMLOps KD Student MNIST ESP32 Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_source:
        description: "train = distill in CI; colab_import = deploy the exact Colab model in models/colab/"
        type: choice
        options: [train, colab_import]
        default: train

concurrency:
  group: tinymlops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TF_USE_LEGACY_KERAS: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  ml-train-and-gate:
    name: "1 · Distill, quantize, gate, codegen"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODEL_SOURCE: ${{ inputs.model_source || 'train' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache MNIST dataset
        uses: actions/cache@v4
        with:
          path: ~/.keras/datasets
          key: mnist-npz-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Teacher cache key (hash of teacher architecture + training config)
        id: teacher
        run: |
          key=$(python -c "import sys; sys.path.insert(0,'ml_pipeline'); import train_and_quantize as t; print(t.teacher_cache_key(t.load_config()))" 2>/dev/null | tail -1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "teacher cache key: $key"

      - name: Cache trained teacher
        if: env.MODEL_SOURCE == 'train'
        uses: actions/cache@v4
        with:
          path: artifacts/teacher_cache
          key: teacher-${{ steps.teacher.outputs.key }}

      - name: Stage 1 · Teacher -> baseline student -> KD student -> INT8 PTQ
        if: env.MODEL_SOURCE == 'train'
        run: python ml_pipeline/train_and_quantize.py

      - name: Stage 1 · Import exact Colab KD student (models/colab/)
        if: env.MODEL_SOURCE == 'colab_import'
        run: |
          python ml_pipeline/train_and_quantize.py \
            --import-h5 models/colab/student_kd.h5 --import-tflite models/colab/student_kd_int8.tflite

      - name: Stage 2 · Quality gates (flash / accuracy / operators / quantization)
        run: python ml_pipeline/evaluate_and_gate.py

      - name: Stage 3 · Generate C++ headers
        run: python ml_pipeline/export_to_cpp.py

      - name: Layer 1 · pytest
        run: python -m pytest -v --junitxml=artifacts/pytest.xml tests/

      - name: Layer 2 · Host reference parity (test_vectors.h vs tf.lite.Interpreter)
        run: python tests/serial_hil_verifier.py --host-only

      - name: ML step summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("artifacts/metrics.json").read_text())
          g = json.loads(pathlib.Path("artifacts/gate_report.json").read_text())
          gm = g["metrics"]
          print("## TinyMLOps · Knowledge Distillation & Quality Gates\n")
          print(f"**Model source:** `{g.get('model_source', 'n/a')}`\n")
          kd = g.get("kd", {})
          if kd:
              print("| Model (Keras FP32) | Test accuracy |\n|---|---|")
              for k, label in [("teacher_keras_test_accuracy", "Teacher CNN (503,690 params)"),
                               ("baseline_student_keras_test_accuracy", "Baseline student, labels only (14,410 params)"),
                               ("kd_student_keras_test_accuracy", "KD student (14,410 params)")]:
                  if k in kd:
                      print(f"| {label} | {100*kd[k]:.2f}% |")
              if "kd_gain_vs_baseline_student" in kd:
                  print(f"\n**KD gain vs baseline student:** {100*kd['kd_gain_vs_baseline_student']:+.2f} pp\n")
          print("| Deployed KD student | FP32 TFLite | INT8 TFLite (ESP32) |\n|---|---|---|")
          print(f"| TFLite test accuracy (10k) | {100*gm['fp32_tflite_accuracy']:.2f}% | {100*gm['int8_tflite_accuracy']:.2f}% |")
          print(f"| Model size | {gm['fp32_model_bytes']:,} B | {gm['int8_model_bytes']:,} B |")
          print(f"| Compression | 1.00x | {gm['fp32_model_bytes']/gm['int8_model_bytes']:.2f}x |")
          print(f"\n**Accuracy drop:** {100*gm['accuracy_drop']:+.2f} pp · **Operators:** {', '.join(g['operators'])}\n")
          print("| Gate | Status | Measured | Threshold |\n|---|---|---|---|")
          for r in g["gates"]:
              print(f"| {r['name']} | {'✅ PASS' if r['passed'] else '❌ FAIL'} | {r['measured']} | {r['threshold']} |")
          print(f"\nINT8 SHA-256: `{m['int8_sha256']}`\n")
          EOF

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyml-model
          if-no-files-found: warn
          path: |
            artifacts/kd_student_fp32.tflite
            artifacts/kd_student_int8.tflite
            artifacts/metrics.json
            artifacts/gate_report.json
            artifacts/golden_vectors.json
            artifacts/pytest.xml

      - name: Upload generated firmware headers
        uses: actions/upload-artifact@v4
        with:
          name: firmware-headers
          path: |
            firmware_esp32/src/model_data.h
            firmware_esp32/src/test_vectors.h

  # ---------------------------------------------------------------------------
  esp32-build-and-simulate:
    name: "2 · ESP32 build + Wokwi HIL simulation"
    needs: ml-train-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download freshly generated headers
        uses: actions/download-artifact@v4
        with:
          name: firmware-headers
          path: firmware_esp32/src

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO toolchains & libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware_esp32/platformio.ini') }}

      - name: Install PlatformIO + report deps
        run: pip install platformio==6.1.16 numpy==1.26.4 PyYAML==6.0.2

      - name: Compile firmware (Xtensa LX6, esp32dev)
        run: |
          mkdir -p artifacts
          pio run -d firmware_esp32 | tee artifacts/pio_build.log

      - name: Firmware resource report
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, pathlib
          log = pathlib.Path("artifacts/pio_build.log").read_text()
          ram = int(re.search(r"RAM:.*used (\d+) bytes from (\d+)", log)[1])
          fl = re.search(r"Flash:.*used (\d+) bytes from (\d+)", log)
          flash, part = int(fl[1]), int(fl[2])
          print("## ESP32-WROOM-32 Firmware Footprint\n")
          print("| Resource | Used | Of physical | Of budget |\n|---|---|---|---|")
          print(f"| Flash | {flash:,} B | {100*flash/4194304:.2f}% of 4 MB | {100*flash/part:.2f}% of {part:,} B app partition |")
          print(f"| SRAM (static DRAM) | {ram:,} B | {100*ram/532480:.2f}% of 520 KB | incl. 32 KB tensor arena |\n")
          EOF

      - name: Wokwi ESP32 simulation (BIST + UART protocol scenario)
        id: wokwi
        if: env.WOKWI_CLI_TOKEN != ''
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: firmware_esp32
          timeout: 120000
          scenario: test_scenario.yaml
          fail_text: "Guru Meditation"
          serial_log_file: sim_serial.log

      - name: Parse simulator log -> TinyMLOps Deployment & Simulation Report
        if: always() && env.WOKWI_CLI_TOKEN != ''
        run: |
          set +e
          LOG=firmware_esp32/sim_serial.log
          [ -f "$LOG" ] || LOG=sim_serial.log
          python tests/serial_hil_verifier.py --parse-log "$LOG" \
            --target sim --summary-md artifacts/sim_report.md --json-out artifacts/sim_report.json
          rc=$?
          cat artifacts/sim_report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Simulation skipped notice
        if: env.WOKWI_CLI_TOKEN == ''
        run: |
          echo "## Wokwi simulation skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Add a \`WOKWI_CLI_TOKEN\` repository secret (Settings → Secrets and variables → Actions) to enable the ESP32 HIL stage." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware + simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-and-sim
          if-no-files-found: warn
          path: |
            firmware_esp32/.pio/build/esp32dev/firmware.bin
            firmware_esp32/.pio/build/esp32dev/firmware.elf
            firmware_esp32/sim_serial.log
            sim_serial.log
            artifacts/pio_build.log
            artifacts/sim_report.md
            artifacts/sim_report.json
